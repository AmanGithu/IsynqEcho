<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — Isynq</title>
  <meta name="description" content="Sign in to your Isynq account.">
  <link rel="stylesheet" href="css/design-system.css">
  <link rel="stylesheet" href="css/auth.css">
</head>

<body>
  <div class="auth-page">
    <div class="auth-card">
      <div class="auth-header">
        <a href="index.html" class="logo-link">
          <div class="logo-icon">I</div> Isynq
        </a>
        <h1>Welcome back</h1>
        <p>Sign in to continue to your dashboard.</p>
      </div>
      <div class="social-auth">
        <button class="social-btn" id="google-signin" type="button">
          <svg viewBox="0 0 24 24" width="20" height="20">
            <path
              d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 01-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"
              fill="#4285F4" />
            <path
              d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
              fill="#34A853" />
            <path
              d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"
              fill="#FBBC05" />
            <path
              d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
              fill="#EA4335" />
          </svg>
          Continue with Google
        </button>
        <button class="social-btn" id="github-signin" type="button">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="#333">
            <path
              d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z" />
          </svg>
          Continue with GitHub
        </button>
      </div>
      <div class="divider">or sign in with email</div>
      <form class="auth-form" id="signin-form">
        <div class="form-group">
          <label class="form-label" for="email">Email</label>
          <input class="form-input" type="email" id="email" placeholder="you@example.com" required autocomplete="email">
          <span class="form-error">Please enter a valid email</span>
        </div>
        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <div class="password-wrapper">
            <input class="form-input" type="password" id="password" placeholder="Enter your password" required
              autocomplete="current-password">
            <button type="button" class="password-toggle" onclick="togglePassword('password')">👁️</button>
          </div>
          <span class="form-error">Password is required</span>
        </div>
        <button type="submit" class="btn btn-primary">Sign In</button>
      </form>
      <div class="auth-footer">
        Don't have an account? <a href="signup.html">Sign up free</a>
      </div>
    </div>
  </div>
  <script src="js/storage.js?v=20260709b"></script>
  <script src="js/auth.js?v=20260709b"></script>
  <script src="js/oauth.js?v=20260709b"></script>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const returnUrl = urlParams.get('returnUrl');
    const isDesktopFlow = urlParams.get('desktop') === '1';
    const oauthError = urlParams.get('oauth_error');

    if (oauthError) {
      setTimeout(() => showToast(oauthError, 'error'), 100);
    }

    if (isDesktopFlow && returnUrl) {
      const header = document.querySelector('.auth-header p');
      if (header) header.textContent = 'Sign in to connect the Isynq desktop app.';
      const signupLink = document.querySelector('.auth-footer a');
      if (signupLink) {
        signupLink.href = `signup.html?returnUrl=${encodeURIComponent(returnUrl)}&desktop=1`;
      }
    }

    function afterAuthRedirect() {
      if (returnUrl) {
        // returnUrl from URLSearchParams is already decoded once
        window.location.href = returnUrl;
        return;
      }
      window.location.href = 'app/dashboard.html';
    }

    function togglePassword(id) { const i = document.getElementById(id); i.type = i.type === 'password' ? 'text' : 'password'; }
    function showToast(msg, type = 'success') { const t = document.createElement('div'); t.className = `auth-toast ${type}`; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.classList.add('show'), 50); setTimeout(() => { t.classList.remove('show'); setTimeout(() => t.remove(), 300); }, 3000); }

    document.getElementById('google-signin').addEventListener('click', () => {
      try {
        IsynqOAuth.startGoogle(returnUrl || undefined);
      } catch (e) {
        showToast(e.message, 'error');
      }
    });
    document.getElementById('github-signin').addEventListener('click', () => {
      try {
        IsynqOAuth.startGitHub(returnUrl || undefined);
      } catch (e) {
        showToast(e.message, 'error');
      }
    });
    document.getElementById('signin-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      document.querySelectorAll('.form-group').forEach(g => g.classList.remove('error'));
      if (!email) { document.getElementById('email').closest('.form-group').classList.add('error'); return; }
      if (!password) { document.getElementById('password').closest('.form-group').classList.add('error'); return; }
      
      const btn = e.target.querySelector('button[type="submit"]');
      btn.classList.add('loading');
      
      try { 
        await IsynqAuth.login({ email, password }); 
        showToast('Welcome back!'); 
        setTimeout(() => afterAuthRedirect(), 800); 
      }
      catch (e) { 
        showToast(e.message, 'error'); 
      } finally {
        btn.classList.remove('loading');
      }
    });
    if (IsynqAuth.isAuthenticated()) {
      if (returnUrl) window.location.href = returnUrl;
      else window.location.href = 'app/dashboard.html';
    }
  </script>
</body>

</html>
