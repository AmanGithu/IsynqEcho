<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings — Isynq</title>
  <link rel="stylesheet" href="../css/design-system.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/dashboard.css">
</head>

<body>
  <div class="app-layout">
    <header class="app-header">
      <div class="header-inner">
        <a href="../index.html" class="header-logo">
          <div class="logo-icon">I</div><span>Isynq</span>
        </a>
        <nav class="header-nav" style="gap:20px;">
          <a href="dashboard.html">Dashboard</a>
          <a href="assistants.html">Assistants</a>
          <a href="sessions.html">Sessions</a>
          <a href="documents.html">Documents</a>
          <a href="audio-check.html">Audio Check</a>
          <a href="account.html">Account</a>
          <a href="settings.html" style="color:var(--color-primary);font-weight:600;">Settings</a>
        </nav>
        <div class="header-actions">
          <button onclick="IsynqAuth.logout();window.location.href='../index.html'" class="btn btn-ghost btn-sm"
            style="color:var(--color-danger);">Sign Out</button>
        </div>
      </div>
    </header>
    <div class="app-content">
      <h2 style="margin-bottom:24px;">Settings</h2>
      <div style="display:grid;gap:24px;max-width:600px;">
        <div class="card">
          <h4 style="margin-bottom:16px;">🤖 AI Provider</h4>
          <div class="form-group">
            <label class="form-label">Provider</label>
            <select class="form-input" id="s-provider">
              <option value="openai">OpenAI (GPT-4o-mini)</option>
              <option value="gemini">Google Gemini (2.0 Flash)</option>
              <option value="ollama">Ollama (Local API)</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label" id="s-apikey-label">API Key / Base URL</label>
            <input class="form-input" type="password" id="s-apikey"
              placeholder="Paste your API key or http://localhost:11434">
            <span style="font-size:0.8125rem;color:var(--color-text-tertiary);" id="s-apikey-help">Saved in your browser
              and synced to your account when signed in.</span>
          </div>
          <div class="form-group">
            <label class="form-label">Model (optional override)</label>
            <input class="form-input" type="text" id="s-model" placeholder="e.g. gpt-4o, gemini-2.5-flash, or llama3">
          </div>
        </div>
        <div class="card">
          <h4 style="margin-bottom:16px;">📝 Response Defaults</h4>
          <div class="form-group">
            <label class="form-label">Default Format</label>
            <select class="form-input" id="s-format">
              <option value="short">Short Answer</option>
              <option value="star">STAR Format</option>
              <option value="detailed">Detailed</option>
              <option value="coding">Code Solution</option>
            </select>
          </div>
        </div>
        <div class="card">
          <h4 style="margin-bottom:16px;">👤 Account</h4>
          <div id="account-info"></div>
          <button class="btn btn-secondary btn-sm"
            style="margin-top:16px;border-color:var(--color-danger);color:var(--color-danger);"
            onclick="if(confirm('Clear all data?')){IsynqStorage.clearAllData();IsynqAuth.logout();window.location.href='../index.html';}">Delete
            All Data</button>
        </div>
        <button class="btn btn-primary" onclick="saveAllSettings()">Save Settings</button>
      </div>
    </div>
  </div>
  <script src="../js/storage.js?v=20260621a"></script>
  <script src="../js/auth.js?v=20260621a"></script>
  <script>
    (async function initSettings() {
      if (!(await IsynqAuth.requireAuth())) return;

    try {
      const me = await IsynqStorage.fetchAPI('/auth/me');
      if (me?.user?.settings) {
        IsynqStorage.set('user_settings', {
          ...(IsynqStorage.get('user_settings') || {}),
          ...me.user.settings
        });
      }
    } catch (err) {
      console.warn('Could not load settings from account:', err);
    }

    const user = IsynqAuth.getCurrentUser();
    const settings = IsynqStorage.get('user_settings') || {};
    document.getElementById('s-provider').value = settings.preferredLLM || 'openai';
    document.getElementById('s-apikey').value = settings.apiKey || '';
    document.getElementById('s-model').value = settings.model || '';
    document.getElementById('s-format').value = settings.responseFormat || 'short';

    // Handle dynamic labels for Ollama
    function updateProviderFields() {
      const provider = document.getElementById('s-provider').value;
      const isOllama = provider === 'ollama';
      const apikeyInput = document.getElementById('s-apikey');
      document.getElementById('s-apikey-label').textContent = isOllama ? 'Base URL (Ollama API)' : 'API Key';
      apikeyInput.type = isOllama ? 'url' : 'password';
      apikeyInput.placeholder = isOllama ? 'http://localhost:11434' : 'Paste your API key';
      document.getElementById('s-apikey-help').textContent = isOllama
        ? 'The base URL where your local Ollama is running.'
        : 'Stored locally and proxied via our backend for secure AI orchestration.';
    }

    document.getElementById('s-provider').addEventListener('change', updateProviderFields);
    updateProviderFields();

    if (user) {
      document.getElementById('account-info').innerHTML = `
    <p><strong>Name:</strong> ${user.name}</p>
    <p><strong>Email:</strong> ${user.email}</p>
    <p><strong>Plan:</strong> ${user.plan}</p>
    <p><strong>Credits:</strong> ${user.creditsRemaining} minutes</p>
  `;
    }
    window.saveAllSettings = async function saveAllSettings() {
      const btn = document.querySelector('button.btn-primary');
      if (btn) btn.disabled = true;
      try {
        const s = IsynqStorage.get('user_settings') || {};
        s.preferredLLM = document.getElementById('s-provider').value;
        s.apiKey = document.getElementById('s-apikey').value.trim();
        s.model = document.getElementById('s-model').value.trim();
        s.responseFormat = document.getElementById('s-format').value;
        const result = await IsynqStorage.saveUserSettings(s);
        alert(result.synced
          ? 'Settings saved to this device and your account.'
          : 'Settings saved on this device. Sign in and ensure the backend is running to sync to your account.');
      } catch (e) {
        alert(e.message || 'Could not save settings');
      } finally {
        if (btn) btn.disabled = false;
      }
    };
    })();
  </script>
</body>

</html>
