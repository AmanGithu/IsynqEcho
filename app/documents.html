<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Documents — Isynq</title>
  <link rel="stylesheet" href="../css/design-system.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/dashboard.css">
</head>

<body>
  <div class="app-shell">
    <div id="sidebar-root"></div>
    <div class="app-main">
      <div class="app-content">
      <div class="app-page-header">
        <div>
          <h2>Documents<span class="count-badge" id="count-badge">0 total</span></h2>
          <p>Upload and manage your documents</p>
        </div>
        <button class="btn btn-primary" onclick="openUploadModal()">⬆ Upload</button>
      </div>

      <div class="data-table-card">
        <div class="data-table-toolbar">
          <div class="data-table-search">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="11" cy="11" r="7" />
              <line x1="21" y1="21" x2="16.65" y2="16.65" />
            </svg>
            <input type="text" id="search-input" placeholder="Search documents..." oninput="renderList()">
          </div>
        </div>
        <div id="doc-list"></div>
      </div>
    </div>
  </div>

  <!-- Upload Modal -->
  <div class="modal-overlay" id="modal" style="display:none;">
    <div class="modal-card">
      <h3>Upload Document</h3>
      <div class="form-group">
        <label class="form-label">File name</label>
        <input type="text" class="form-input" id="form-filename" placeholder="e.g. Resume.txt">
      </div>
      <div class="form-group">
        <label class="form-label">Type</label>
        <select class="form-input" id="form-type">
          <option value="resume">Resume</option>
          <option value="jd">Job Description</option>
          <option value="notes" selected>Notes</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Choose a .txt file (optional)</label>
        <input type="file" id="form-file" accept=".txt,.md" onchange="handleFilePick(event)">
      </div>
      <div class="form-group">
        <label class="form-label">Content</label>
        <textarea class="form-input" id="form-content" rows="8" placeholder="Paste or upload document text..."></textarea>
      </div>
      <div style="display:flex;gap:12px;margin-top:8px;">
        <button class="btn btn-primary" onclick="saveDocument()">Save</button>
        <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      </div>
    </div>
  </div>
  </div>

  <script src="../js/storage.js?v=20260714b"></script>
  <script src="../js/auth.js?v=20260709b"></script>
  <script src="../js/sidebar.js?v=20260714b"></script>
  <script>
    let documents = [];

    (async function init() {
      if (!(await IsynqAuth.requireAuth())) return;
      IsynqSidebar.render('documents');

      const user = IsynqAuth.getCurrentUser();

      await loadDocuments();
    })();

    async function loadDocuments() {
      const list = document.getElementById('doc-list');
      list.innerHTML = `<div class="empty-state" style="padding:48px;">Loading documents...</div>`;
      try {
        documents = await IsynqStorage.getDocuments();
      } catch (err) {
        documents = [];
      }
      renderList();
    }

    function renderList() {
      const query = (document.getElementById('search-input').value || '').toLowerCase();
      const filtered = documents.filter(d => (d.name || d.fileName || '').toLowerCase().includes(query));
      const list = document.getElementById('doc-list');

      document.getElementById('count-badge').textContent = `${documents.length} total`;

      if (!filtered.length) {
        list.innerHTML = `
          <div class="empty-state" style="padding:64px 24px;">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="48" height="48" style="margin:0 auto 16px;">
              <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z" />
              <polyline points="14 2 14 8 20 8" />
            </svg>
            <p style="font-weight:600;margin-bottom:6px;">No Documents Found</p>
            <p style="margin-bottom:16px;">Upload your first document to get started.</p>
            <button class="btn btn-primary" onclick="openUploadModal()">⬆ Upload Document</button>
          </div>`;
        return;
      }

      const typeIcons = { resume: '🧑‍💼', jd: '📋', notes: '📝' };
      list.innerHTML = `<table class="data-table">
        <thead><tr><th>Name</th><th style="width:120px;">Type</th><th style="width:160px;">Uploaded</th><th style="width:80px;"></th></tr></thead>
        <tbody>
          ${filtered.map(d => `
            <tr>
              <td>${typeIcons[d.type] || '📄'} ${d.name || d.fileName || 'Untitled'}</td>
              <td>${d.type || 'notes'}</td>
              <td>${d.uploadedAt ? new Date(d.uploadedAt).toLocaleDateString() : '—'}</td>
              <td><button class="btn btn-ghost btn-sm" style="color:var(--color-danger);" onclick="removeDocument('${d.id}')">Delete</button></td>
            </tr>
          `).join('')}
        </tbody>
      </table>`;
    }

    function openUploadModal() {
      document.getElementById('form-filename').value = '';
      document.getElementById('form-type').value = 'notes';
      document.getElementById('form-file').value = '';
      document.getElementById('form-content').value = '';
      document.getElementById('modal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('modal').style.display = 'none';
    }

    function handleFilePick(event) {
      const file = event.target.files[0];
      if (!file) return;
      if (!document.getElementById('form-filename').value) {
        document.getElementById('form-filename').value = file.name;
      }
      const reader = new FileReader();
      reader.onload = (e) => { document.getElementById('form-content').value = e.target.result; };
      reader.readAsText(file);
    }

    async function saveDocument() {
      const fileName = document.getElementById('form-filename').value.trim();
      const content = document.getElementById('form-content').value.trim();
      if (!fileName) { alert('File name is required'); return; }
      if (!content) { alert('Document content is required'); return; }

      try {
        await IsynqStorage.addDocument({
          type: document.getElementById('form-type').value,
          content,
          fileName
        });
        closeModal();
        await loadDocuments();
      } catch (err) {
        alert(err.message || 'Failed to upload document');
      }
    }

    async function removeDocument(id) {
      if (!confirm('Delete this document? This cannot be undone.')) return;
      try {
        await IsynqStorage.deleteDocument(id);
        await loadDocuments();
      } catch (err) {
        alert(err.message || 'Failed to delete document');
      }
    }

    function handleLogout() {
      IsynqAuth.logout();
      window.location.href = '../index.html';
    }
  </script>
</body>

</html>
