<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sessions — Isynq</title>
  <link rel="stylesheet" href="../css/design-system.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/dashboard.css">
</head>

<body>
  <div class="app-layout">
    <header class="app-header">
      <div class="header-inner">
        <a href="../index.html" class="header-logo">
          <div class="logo-icon">I</div><span>Isynq</span>
        </a>
        <nav class="header-nav" style="gap:20px;">
          <a href="dashboard.html">Dashboard</a>
          <a href="assistants.html">Assistants</a>
          <a href="sessions.html" style="color:var(--color-primary);font-weight:600;">Sessions</a>
          <a href="documents.html">Documents</a>
          <a href="settings.html">Settings</a>
        </nav>
        <div class="header-actions">
          <span id="user-name" style="font-weight:500;font-size:0.9375rem;color:var(--color-text-secondary);"></span>
          <button onclick="handleLogout()" class="btn btn-ghost btn-sm" style="color:var(--color-danger);">Sign
            Out</button>
        </div>
        <button class="hamburger" aria-label="Menu"
          onclick="document.querySelector('.mobile-dash-nav').classList.toggle('open')"><span></span><span></span><span></span></button>
      </div>
    </header>

    <div class="mobile-dash-nav"
      style="display:none;position:fixed;top:var(--header-height);left:0;right:0;background:#fff;padding:16px;z-index:999;box-shadow:var(--shadow-md);">
      <a href="dashboard.html" style="display:block;padding:12px;">Dashboard</a>
      <a href="assistants.html" style="display:block;padding:12px;">Assistants</a>
      <a href="sessions.html" style="display:block;padding:12px;font-weight:600;color:var(--color-primary);">Sessions</a>
      <a href="documents.html" style="display:block;padding:12px;">Documents</a>
      <a href="settings.html" style="display:block;padding:12px;">Settings</a>
      <button onclick="handleLogout()"
        style="display:block;padding:12px;color:var(--color-danger);width:100%;text-align:left;">Sign Out</button>
    </div>

    <div class="app-content">
      <div class="app-page-header">
        <div>
          <h2>Sessions<span class="count-badge" id="count-badge">0 total</span></h2>
          <p>Manage and track your recorded sessions</p>
        </div>
      </div>

      <div class="data-table-card">
        <div class="data-table-toolbar">
          <div class="data-table-search">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="11" cy="11" r="7" />
              <line x1="21" y1="21" x2="16.65" y2="16.65" />
            </svg>
            <input type="text" id="search-input" placeholder="Search by assistant or user..." oninput="renderTable()">
          </div>
        </div>
        <table class="data-table">
          <thead>
            <tr>
              <th style="width:60px;">No</th>
              <th>Assistant</th>
              <th>Start Time</th>
              <th style="width:100px;">Duration</th>
              <th>User</th>
            </tr>
          </thead>
          <tbody id="table-body"></tbody>
        </table>
        <div class="data-table-footer">
          <span id="showing-text">Showing 0 of 0 sessions</span>
        </div>
      </div>
    </div>
  </div>

  <script src="../js/storage.js?v=20260621a"></script>
  <script src="../js/auth.js?v=20260621a"></script>
  <script>
    let sessions = [];
    let currentUserEmail = '';

    (async function init() {
      if (!(await IsynqAuth.requireAuth())) return;

      const user = IsynqAuth.getCurrentUser();
      if (user) {
        document.getElementById('user-name').textContent = user.name;
        currentUserEmail = user.email || '';
      }

      await loadSessions();
    })();

    async function loadSessions() {
      const body = document.getElementById('table-body');
      body.innerHTML = `<tr><td colspan="5" style="text-align:center;padding:32px;color:var(--color-text-tertiary);">Loading sessions...</td></tr>`;
      sessions = await IsynqStorage.getSessions();
      renderTable();
    }

    function formatDuration(seconds) {
      if (!seconds) return '0 mins';
      const mins = Math.ceil(seconds / 60);
      return `${mins} min${mins === 1 ? '' : 's'}`;
    }

    function renderTable() {
      const query = (document.getElementById('search-input').value || '').toLowerCase();
      const filtered = sessions.filter(s => {
        const assistantName = (s.assistant?.name || s.type || '').toLowerCase();
        return assistantName.includes(query) || currentUserEmail.toLowerCase().includes(query);
      });
      const body = document.getElementById('table-body');

      document.getElementById('count-badge').textContent = `${sessions.length} total`;
      document.getElementById('showing-text').textContent = `Showing 1-${filtered.length} of ${filtered.length} sessions`;

      if (!filtered.length) {
        body.innerHTML = `<tr><td colspan="5" style="text-align:center;color:var(--color-text-tertiary);padding:32px;">No sessions found.</td></tr>`;
        return;
      }

      body.innerHTML = filtered.map((s, i) => `
        <tr>
          <td>${i + 1}</td>
          <td><span class="assistant-name-link" onclick="window.location.href='session-detail.html?id=${s.id}'">${s.assistant?.name || (s.type ? s.type.charAt(0).toUpperCase() + s.type.slice(1) : 'Session')}</span></td>
          <td>${new Date(s.startTime).toLocaleString()}</td>
          <td><span class="count-badge">${formatDuration(s.duration)}</span></td>
          <td>${currentUserEmail}</td>
        </tr>
      `).join('');
    }

    function handleLogout() {
      IsynqAuth.logout();
      window.location.href = '../index.html';
    }
  </script>
</body>

</html>
